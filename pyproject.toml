[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalcheck"
version = "0.1.0"
description = "Is each saved job posting really still open? A deterministic, read-only checker for Greenhouse, Ashby, Lever, Workday and other job pages."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
]

[project.scripts]
signalcheck = "signalcheck.cli:entry"

[project.urls]
Homepage = "https://github.com/jonokane/signalcheck"

[tool.setuptools]
packages = ["signalcheck"]
